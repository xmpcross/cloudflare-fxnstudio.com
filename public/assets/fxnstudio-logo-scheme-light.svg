<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none" role="img" aria-label="FXN Studio Logo Light">
  <defs>
    <linearGradient id="fxn-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Minimal Minimalist Monogram Mark -->
  <g transform="translate(2, 4)">
    <!-- Outer Hex / Diamond Vector Mark -->
    <path d="M 10 20 L 22 2 L 34 20 L 22 38 Z" stroke="url(#fxn-grad-light)" stroke-width="3" fill="none" stroke-linejoin="round" />
    <!-- Inner Precision Axis (X/N Cross) -->
    <path d="M 16 11 L 28 29" stroke="url(#fxn-grad-light)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 28 11 L 16 29" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="22" cy="20" r="3" fill="#c084fc" />
  </g>

  <!-- Wordmark Text -->
  <text x="50" y="31" font-family="'Urbanist', 'Outfit', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#ffffff">FXN</text>
  <text x="110" y="31" font-family="'Urbanist', 'Outfit', system-ui, sans-serif" font-size="24" font-weight="400" letter-spacing="4" fill="#c084fc">STUDIO</text>
  <circle cx="232" cy="28" r="3" fill="#38bdf8" />
</svg>
